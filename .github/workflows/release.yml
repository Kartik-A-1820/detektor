name: Release

# Push a tag like v1.1.0 to publish: tests -> multi-arch container image (GHCR) -> GitHub Release.
# Run it manually (Actions -> Release -> Run workflow) for a dry run: it runs every check and builds
# every image but never pushes or releases anything (only tag pushes publish).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -ra
      - name: Tag matches api.__version__ and the changelog has notes
        run: |
          VERSION="$(python -c 'import api; print(api.__version__)')"
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then TAG="v${VERSION}"; fi   # dry run from a branch
          python scripts/release_notes.py --tag "$TAG" --out release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  image:
    name: Image (${{ matrix.variant }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            platforms: linux/amd64,linux/arm64
            torch_index: https://download.pytorch.org/whl/cpu
            suffix: ""
          - variant: gpu
            platforms: linux/amd64
            torch_index: https://download.pytorch.org/whl/cu121
            suffix: "-gpu"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (CUDA wheels are large)
        if: matrix.variant == 'gpu'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-qemu-action@v3
        if: matrix.variant == 'cpu'
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dryrun,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
      - name: Build a single-arch image and smoke-test it
        if: matrix.variant == 'cpu'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: detektor:smoke
          build-args: TORCH_INDEX_URL=${{ matrix.torch_index }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
      - name: Functional smoke test (serve a model, check auth, inference, metrics, healthcheck)
        if: matrix.variant == 'cpu'
        run: scripts/docker_smoke.sh detektor:smoke
      - name: Build${{ env.PUBLISH == 'true' && ' and push' || '' }} multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platforms }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: TORCH_INDEX_URL=${{ matrix.torch_index }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  release:
    name: GitHub Release
    needs: [verify, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            cat release-notes.md
            echo
            echo "## Container images"
            echo '```bash'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY,,}:${TAG#v}        # CPU (linux/amd64, linux/arm64)"
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY,,}:${TAG#v}-gpu    # NVIDIA GPU (linux/amd64)"
            echo '```'
          } > final-notes.md
          gh release create "$TAG" --verify-tag --title "Detektor ${TAG}" --notes-file final-notes.md \
            benchmarks/results/baseline-cpu.json benchmarks/results/baseline-cpu.md
